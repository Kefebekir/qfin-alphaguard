[project]
name = "qfin-alphaguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kutalp Efe Bekir", email = "kefebekir@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.9.3",
    "duckdb>=1.5.5",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "yfinance>=1.7.0",
]

[project.scripts]
qfin-alphaguard = "qfin_alphaguard:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
